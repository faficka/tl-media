name: notify
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notify
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 cloud/notify.py
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
          BUFFER_KEY_GARY: ${{ secrets.BUFFER_KEY_GARY }}
          BUFFER_KEY_PRINTARA: ${{ secrets.BUFFER_KEY_PRINTARA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - run: |
          git config user.name faficka
          git config user.email faficka@users.noreply.github.com
          git add cloud/notify_state.json
          git diff --cached --quiet || (git commit -m "notify state" && git pull --rebase && git push)
